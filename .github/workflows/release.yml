# Builds termsuji for the Asciiverse catalog: one archive per target, named
# termsuji-<target>.tar.gz (Linux, macOS) or .zip (Windows), each with GNU
# Go 3.9.1 beside termsuji, plus SHA256SUMS and the GNU Go source the
# binaries were built from, attached to a GitHub release
# (hub/catalog/SCHEMA.md, release.source = "github"). Runs on our tags
# only (*-av.*), or by hand for an existing tag.
#
# termsuji is Go with CGO off, so it is static everywhere. GNU Go is built
# by asciiverse/gnugo.sh: static in Alpine for Linux, natively on each
# macOS runner, and cross-built with MinGW for Windows. An online-go.com
# OAuth client id in the OGS_CLIENT_ID secret turns on online play; without
# one the build plays GNU Go only.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Client id
        env:
          OGS_CLIENT_ID: ${{ secrets.OGS_CLIENT_ID }}
        run: printf '%s' "$OGS_CLIENT_ID" > api/client_id.txt

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base curl go zip &&
            asciiverse/gnugo.sh &&
            CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build/termsuji . &&
            asciiverse/package.sh ${{ matrix.target }} build/termsuji'
          file stage/termsuji stage/gnugo

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: aarch64-apple-darwin, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Client id
        env:
          OGS_CLIENT_ID: ${{ secrets.OGS_CLIENT_ID }}
        run: printf '%s' "$OGS_CLIENT_ID" > api/client_id.txt

      - name: Build and package
        run: |
          asciiverse/gnugo.sh
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build/termsuji .
          file build/termsuji stage/gnugo
          asciiverse/package.sh ${{ matrix.target }} build/termsuji

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Client id
        env:
          OGS_CLIENT_ID: ${{ secrets.OGS_CLIENT_ID }}
        run: printf '%s' "$OGS_CLIENT_ID" > api/client_id.txt

      - name: Build and package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip
          CROSS=x86_64-w64-mingw32 asciiverse/gnugo.sh
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/termsuji.exe .
          file build/termsuji.exe stage/gnugo.exe
          asciiverse/package.sh "$TARGET" build/termsuji.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "termsuji $TAG" \
                 --notes "termsuji $TAG from github.com/lvank/termsuji, with play against GNU Go 3.9.1 (beside it in every archive) and the changes in PATCHES.md, built for the Asciiverse catalog. gnugo-3.9.1-source.tar.gz is the GNU Go source the binaries were built from (GPL-3.0-or-later)."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
